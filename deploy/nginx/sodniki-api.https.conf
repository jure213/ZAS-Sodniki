limit_req_zone $binary_remote_addr zone=zas_sodniki_api_limit:10m rate=600r/m;

server {
    listen 443 ssl;
    server_name sodniki-api.jurer.eu;

    ssl_certificate /etc/letsencrypt/live/sodniki-api.jurer.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sodniki-api.jurer.eu/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location /rest/v1/ {
        limit_req zone=zas_sodniki_api_limit burst=100 nodelay;
        client_max_body_size 2m;

        proxy_pass http://zas-sodniki-api:3000/;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
