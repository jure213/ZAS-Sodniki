# Throwaway LOCAL stack for rehearsing a migration on a copy of the real data
# (DEPLOYMENT.md section 8). Never run this on the VPS.
#
# Same images as the real stack, but with no external networks and no fixed
# container names, so it cannot collide with anything. nginx serves the
# /rest/v1 prefix like production. Ports are bound to 127.0.0.1 only.
#
# Secrets come from deploy/rehearsal/.env (gitignored, see DEPLOYMENT.md).
services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: zas_sodniki
      POSTGRES_USER: zas_sodniki_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD:?POSTGREST_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zas_sodniki_admin -d zas_sodniki"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - rehearsal_pgdata:/var/lib/postgresql/data
      - ../init:/docker-entrypoint-initdb.d:ro
      - ../dumps:/migrations:ro

  api:
    image: postgrest/postgrest:v14.12
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "host=db port=5432 dbname=zas_sodniki user=postgrest_authenticator password=${POSTGREST_DB_PASSWORD:?POSTGREST_DB_PASSWORD is required}"
      PGRST_DB_SCHEMAS: public
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}
      PGRST_DB_ANON_ROLE: zas_anon
      PGRST_DB_PRE_REQUEST: private.check_request
      PGRST_OPENAPI_MODE: disabled
      PGRST_DB_TX_END: commit-allow-override
      PGRST_SERVER_PORT: 3000
    ports:
      - "127.0.0.1:${REHEARSAL_API_PORT:-8081}:3000"
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    depends_on: [api]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${REHEARSAL_PORT:-8082}:80"

volumes:
  rehearsal_pgdata:
